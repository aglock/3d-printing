# This file contains common pin mappings for the BIGTREETECH SKR mini
# E3 v3.0. To use this config, the firmware should be compiled for the
# STM32G0B1 with a "8KiB bootloader" and USB communication/USART.

# The "make flash" command does not work on the SKR mini E3. Instead,
# after running "make", copy the generated "out/klipper.bin" file to a
# file named "firmware.bin" on an SD card and then restart the SKR
# mini E3 with that SD card.

# See docs/Config_Reference.md for a description of parameters.

[include mainsail.cfg]
[include Macros.cfg]
[include slicer.cfg]
[include speed_test.cfg]

[bltouch]
sensor_pin: ^PC14
control_pin: PA1
x_offset: -46.5
y_offset: 0
#z_offset: 3.0
speed: 5 #10
samples:2
samples_result:average
probe_with_touch_mode: true
stow_on_each_sample: true


[filament_switch_sensor RunoutSensor]
pause_on_runout: False
runout_gcode: PAUSE
insert_gcode: RESUME
switch_pin: !PC15


[safe_z_home]
home_xy_position: 147,120 # Change coordinates to the center of your print bed
speed: 50
z_hop: 10                # Move up 10mm
z_hop_speed: 5

[bed_mesh]
speed: 150
horizontal_move_z: 5
mesh_min: 10, 5
#mesh_min: 10,75 #for glassplate
#mesh_max: 197.5, 215
mesh_max: 193,230 # for glassplate
probe_count: 5,5
fade_start: 1
fade_end: 10
fade_target: 0
mesh_pps: 3,3
algorithm: bicubic
bicubic_tension: 0.1

[screws_tilt_adjust]
horizontal_move_z: 5
screw1: 70,200
screw1_name: Back left
screw2: 240,200
screw2_name: Back Right
screw3: 70,30
screw3_name: Front Left
screw4: 240,30
screw4_name: Front Right

[stepper_x]
step_pin: !PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC0
position_endstop: -5
position_min: -5
position_max: 240
homing_speed: 100
homing_retract_dist: 5
homing_retract_speed: 25
second_homing_speed: 15

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.580
#hold_current: 0.500
#stealthchop_threshold: 999999

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC1
position_endstop: -2
position_min: -2
position_max: 230
homing_speed: 100
homing_retract_dist: 5
homing_retract_speed: 25
second_homing_speed: 15

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.580 #580
#hold_current: 0.530 #500
#stealthchop_threshold: 999999

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8 #original value
#rotation_distance: 8.17 # Test for LW-PLA
# endstop_pin: ^PC2
# position_endstop: 0.0
endstop_pin: probe:z_virtual_endstop
position_max: 275
position_min: -10
homing_speed: 10
second_homing_speed: 1
homing_retract_dist: 2.0

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.580
#hold_current: 0.500
stealthchop_threshold: 999999

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 7.46662
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 300
pressure_advance: 0 #Set in slicer per filament
max_extrude_only_distance: 110

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650
#hold_current: 0.500
stealthchop_threshold: 999999

[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 130

[heater_fan controller_fan]
pin: PC7
heater: heater_bed
heater_temp: 50.0
max_power: 0.9
kick_start_time: 0.5
fan_speed: 0.9
shutdown_speed: 0.0

[heater_fan hotend_fan]
pin: PC6
max_power: 0.9
shutdown_speed : 0
heater:extruder
heater_temp : 60
fan_speed : 1.0

[fan]
pin: PB15
kick_start_time: 0.5

[input_shaper]
shaper_freq_x: 36.36  # frequency for the X mark of the test model
shaper_freq_y: 42.55  # frequency for the Y mark of the test model
shaper_type: mzv


[mcu]
baud: 250000
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_1900410019504B5735313920-if00
restart_method: command

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]

[gcode_macro G29]				
gcode:
  G28
  bed_mesh_calibrate
  G1 X0 Y0 Z10 F4200

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 3000
max_z_velocity: 10
square_corner_velocity: 5.0
max_z_accel: 100


[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>



#####################################################################
#   Thermals
#####################################################################

[temperature_sensor raspberry_pi]
## Pi Temps
sensor_type: temperature_host
max_temp: 100

[temperature_sensor mcu_temp]
## SKR mini E3 V3
sensor_type: temperature_mcu
max_temp: 100

